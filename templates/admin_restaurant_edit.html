<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل النشاط | Menu Smart</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<style>
body {
    min-height: 100vh;
    margin: 0 !important;
    color: #edf1ff !important;
    background:
        radial-gradient(ellipse at 10% 5%, rgba(139,92,246,.13), transparent 35%),
        radial-gradient(ellipse at 90% 90%, rgba(56,189,248,.08), transparent 32%),
        #080d1b !important;
}

.admin-restaurant-page {
    width: min(900px, 100%);
    max-width: 900px !important;
    margin: 0 auto !important;
    padding: 35px 18px 55px !important;
    background: transparent !important;
}

.admin-restaurant-page h1,
.admin-restaurant-page h2 {
    color: #edf1ff !important;
}

.admin-restaurant-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 22px;
    padding: 22px 24px;
    background: linear-gradient(145deg, #111a2e, #0e1729);
    border: 1px solid #27324b;
    border-radius: 19px;
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
}

.admin-restaurant-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.admin-restaurant-heading-icon,
.admin-restaurant-section-title-icon {
    display: grid;
    place-items: center;
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    color: #c4b5fd;
    background: linear-gradient(145deg, rgba(139,92,246,.2), rgba(56,189,248,.1));
    border: 1px solid rgba(139,92,246,.25);
    font-size: 21px;
}

.admin-restaurant-heading h1 {
    margin: 0 0 7px;
    font-size: 23px;
    font-weight: 800;
}

.admin-restaurant-heading p {
    margin: 0;
    color: #9aa8c0 !important;
    font-size: 13px;
    line-height: 1.7;
}

.admin-restaurant-page .action-btn {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 43px;
    padding: 10px 16px !important;
    border-radius: 11px !important;
    font-size: 13px !important;
    font-weight: 800 !important;
    text-decoration: none !important;
    cursor: pointer;
    transition: .2s ease;
}

.admin-restaurant-page .admin-restaurant-back,
.admin-restaurant-page .admin-restaurant-footer a {
    color: #dce3f3 !important;
    background: rgba(255,255,255,.045) !important;
    border: 1px solid #34415c !important;
}

.admin-restaurant-page .approve-btn {
    color: #fff !important;
    background: linear-gradient(110deg, #6d28d9, #8b5cf6) !important;
    border: 1px solid rgba(196,181,253,.2) !important;
}

.admin-restaurant-page .action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.admin-restaurant-section {
    overflow: hidden;
    background: linear-gradient(150deg, #111a2e, #0e1729) !important;
    border: 1px solid #27324b !important;
    border-radius: 20px !important;
    box-shadow: 0 14px 35px rgba(0,0,0,.2) !important;
}

.admin-restaurant-section-title {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 21px 24px;
    border-bottom: 1px solid rgba(165,175,197,.13);
}

.admin-restaurant-section-title-icon {
    flex-basis: 44px;
    width: 44px;
    height: 44px;
    font-size: 19px;
}

.admin-restaurant-section-title h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
}

.admin-restaurant-section .reset-form {
    padding: 24px;
}

.admin-restaurant-info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 19px;
}

.admin-restaurant-info-item {
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-width: 0;
}

.admin-restaurant-info-item > span {
    color: #cbd5e1 !important;
    font-size: 13px;
    font-weight: 700;
}

.admin-restaurant-page input,
.admin-restaurant-page textarea {
    width: 100%;
    min-width: 0;
    min-height: 46px;
    padding: 12px 14px;
    color: #edf1ff !important;
    background: #0a1324 !important;
    border: 1px solid #34415c !important;
    border-radius: 11px !important;
    outline: none !important;
    font: inherit;
    font-size: 14px;
    transition: border-color .2s, box-shadow .2s;
}

.admin-restaurant-page textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.8;
}

.admin-restaurant-page input:focus,
.admin-restaurant-page textarea:focus {
    border-color: #8b5cf6 !important;
    box-shadow: 0 0 0 3px rgba(139,92,246,.15) !important;
}

.admin-restaurant-page input::placeholder,
.admin-restaurant-page textarea::placeholder {
    color: #718096 !important;
}

.admin-restaurant-info-item:has(textarea) {
    grid-column: 1 / -1;
}

.admin-restaurant-footer {
    display: flex;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 11px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(165,175,197,.13);
}

.admin-restaurant-footer .action-btn {
    min-width: 125px;
}

.admin-restaurant-page button:focus-visible,
.admin-restaurant-page a:focus-visible {
    outline: 2px solid #38bdf8;
    outline-offset: 3px;
}

@media (max-width: 650px) {
    .admin-restaurant-page {
        padding: 20px 13px 35px !important;
    }

    .admin-restaurant-header {
        flex-direction: column;
        align-items: stretch;
        padding: 19px;
    }

    .admin-restaurant-header > a {
        width: 100%;
    }

    .admin-restaurant-section .reset-form {
        padding: 18px;
    }

    .admin-restaurant-info-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .admin-restaurant-info-item:has(textarea) {
        grid-column: auto;
    }

    .admin-restaurant-footer {
        flex-direction: column;
    }

    .admin-restaurant-footer .action-btn {
        width: 100%;
    }
}

@media (max-width: 380px) {
    .admin-restaurant-page {
        padding-inline: 10px !important;
    }

    .admin-restaurant-heading h1 {
        font-size: 20px;
    }

    .admin-restaurant-section-title {
        padding: 17px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .admin-restaurant-page *,
    .admin-restaurant-page *::before,
    .admin-restaurant-page *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
\n</head>

<body>

<div class="container admin-restaurant-page">

    <div class="admin-restaurant-header">

        <div class="admin-restaurant-heading">

            <div class="admin-restaurant-heading-icon">
                ✏️
            </div>

            <div>
                <h1>تعديل النشاط</h1>
                <p>تعديل بيانات النشاط من لوحة الإدارة</p>
            </div>

        </div>

        <a
            href="{{ url_for('admin_restaurant', restaurant_id=restaurant['id']) }}"
            class="action-btn admin-restaurant-back"
        >
            ← العودة لملف النشاط
        </a>

    </div>


    <div class="admin-restaurant-section">

        <div class="admin-restaurant-section-title">

            <div class="admin-restaurant-section-title-icon">
                🏪
            </div>

            <h2>بيانات النشاط</h2>

        </div>


        <form
            method="POST"
            class="reset-form"
        >

            <div class="admin-restaurant-info-grid">

                <div class="admin-restaurant-info-item">

                    <span>اسم النشاط</span>

                    <input
                        type="text"
                        name="restaurant_name"
                        value="{{ restaurant['name'] or '' }}"
                        required
                    >

                </div>


                <div class="admin-restaurant-info-item">

                    <span>رقم الهاتف</span>

                    <input
                        type="text"
                        name="phone"
                        value="{{ restaurant['phone'] or '' }}"
                    >

                </div>


                <div class="admin-restaurant-info-item">

                    <span>العنوان</span>

                    <input
                        type="text"
                        name="address"
                        value="{{ restaurant['address'] or '' }}"
                    >

                </div>


                <div class="admin-restaurant-info-item">

                    <span>الوصف</span>

                    <textarea
                        name="description"
                        rows="4"
                    >{{ restaurant['description'] or '' }}</textarea>

                </div>

            </div>


            <div class="admin-restaurant-footer">

                <button
                    type="submit"
                    class="action-btn approve-btn"
                >
                    💾 حفظ التعديلات
                </button>

                <a
                    href="{{ url_for('admin_restaurant', restaurant_id=restaurant['id']) }}"
                    class="action-btn"
                >
                    إلغاء
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
