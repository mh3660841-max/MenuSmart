<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إعدادات حسابي | Menu Smart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(139, 92, 246, .13), transparent 35%),
                radial-gradient(ellipse at 88% 85%, rgba(56, 189, 248, .09), transparent 34%),
                #080d1b;
            color: #edf1ff;
            font-family: Arial, sans-serif;
        }

        .admin-settings-page {
            width: min(1050px, 100%);
            margin: 0 auto;
            padding: 35px 18px 50px;
        }

        .settings-header {
            position: relative;
            overflow: hidden;
            background: linear-gradient(120deg, #111a2e, #17223a);
            color: #edf1ff;
            border: 1px solid rgba(139, 92, 246, .24);
            border-radius: 22px;
            padding: 25px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .22);
        }

        .settings-header::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            left: -65px;
            top: -110px;
            border-radius: 50%;
            background: rgba(139, 92, 246, .12);
            pointer-events: none;
        }

        .settings-heading {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .settings-heading-icon {
            flex: 0 0 58px;
            width: 58px;
            height: 58px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, rgba(139, 92, 246, .25), rgba(56, 189, 248, .13));
            border: 1px solid rgba(139, 92, 246, .3);
            color: #c4b5fd;
            font-size: 25px;
        }

        .settings-heading h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .settings-heading p {
            margin: 7px 0 0;
            color: #a5afc5;
            font-size: 14px;
            line-height: 1.7;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 12px;
            color: #edf1ff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .05);
            transition: .2s ease;
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        .back-btn:hover {
            background: rgba(139, 92, 246, .16);
            border-color: rgba(139, 92, 246, .45);
            transform: translateY(-2px);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            align-items: stretch;
        }

        .settings-card {
            min-width: 0;
            background: linear-gradient(155deg, #111a2e, #0e1729);
            border-radius: 22px;
            padding: 26px;
            border: 1px solid #27324b;
            box-shadow: 0 14px 35px rgba(0, 0, 0, .2);
        }

        .settings-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(165, 175, 197, .13);
        }

        .card-icon {
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(139, 92, 246, .2), rgba(56, 189, 248, .12));
            border: 1px solid rgba(139, 92, 246, .25);
            color: #c4b5fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .settings-card h2 {
            margin: 0;
            font-size: 19px;
            color: #edf1ff;
        }

        .settings-card-subtitle {
            margin: 5px 0 0;
            color: #9aa8c0;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            color: #dce3f3;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            min-height: 47px;
            padding: 13px 14px;
            border: 1px solid #34415c;
            border-radius: 12px;
            background: #0a1324;
            color: #edf1ff;
            outline: none;
            font-size: 14px;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .field input::placeholder {
            color: #718096;
        }

        .field input:focus {
            border-color: #8b5cf6;
            background: #101a30;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .15);
        }

        .save-btn {
            width: 100%;
            min-height: 48px;
            border: 1px solid rgba(196, 181, 253, .2);
            border-radius: 12px;
            padding: 13px 16px;
            background: linear-gradient(110deg, #6d28d9, #8b5cf6);
            color: white;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(109, 40, 217, .28);
            filter: brightness(1.08);
        }

        .save-btn:focus-visible,
        .back-btn:focus-visible {
            outline: 2px solid #38bdf8;
            outline-offset: 3px;
        }

        .danger-note {
            background: rgba(56, 189, 248, .07);
            border: 1px solid rgba(56, 189, 248, .2);
            color: #c4dff2;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {
            .admin-settings-page {
                padding: 22px 14px 35px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .settings-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 22px;
            }

            .back-btn {
                width: 100%;
            }
        }

        @media (max-width: 420px) {
            .settings-heading {
                align-items: flex-start;
                gap: 12px;
            }

            .settings-heading-icon {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
                border-radius: 14px;
            }

            .settings-heading h1 {
                font-size: 21px;
            }

            .settings-card {
                padding: 20px 16px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

<div class="admin-settings-page">

    <!-- HEADER -->

    <div class="settings-header">

        <div class="settings-heading">

            <div class="settings-heading-icon">
                ⚙
            </div>

            <div>
                <h1>إعدادات حسابي</h1>
                <p>إدارة بيانات حساب مدير النظام وكلمة المرور</p>
            </div>

        </div>

        <a
            href="{{ url_for('admin') }}"
            class="back-btn"
        >
            ← لوحة الإدارة
        </a>

    </div>


    <div class="settings-grid">

        <!-- ACCOUNT CARD -->

        <div class="settings-card">

            <div class="settings-card-header">

                <div class="card-icon">
                    👤
                </div>

                <div>
                    <h2>بيانات الحساب</h2>
                    <p class="settings-card-subtitle">
                        تعديل بيانات مدير النظام
                    </p>
                </div>

            </div>

            <form
                method="POST"
                action="{{ url_for('admin_settings') }}"
            >

                <input
                    type="hidden"
                    name="action"
                    value="profile"
                >

                <div class="field">

                    <label>
                        اسم الأدمن
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ user['name'] or '' }}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user['email'] or '' }}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        رقم الهاتف
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ user['phone'] or '' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    حفظ بيانات الحساب
                </button>

            </form>

        </div>


        <!-- PASSWORD CARD -->

        <div class="settings-card">

            <div class="settings-card-header">

                <div class="card-icon">
                    🔐
                </div>

                <div>
                    <h2>أمان الحساب</h2>
                    <p class="settings-card-subtitle">
                        تغيير كلمة مرور مدير النظام
                    </p>
                </div>

            </div>

            <div class="danger-note">
                لأمان حسابك، أدخل كلمة المرور الحالية قبل تعيين كلمة مرور جديدة.
            </div>

            <form
                method="POST"
                action="{{ url_for('admin_settings') }}"
            >

                <input
                    type="hidden"
                    name="action"
                    value="password"
                >

                <div class="field">

                    <label>
                        كلمة المرور الحالية
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        كلمة المرور الجديدة
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    تغيير كلمة المرور
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
