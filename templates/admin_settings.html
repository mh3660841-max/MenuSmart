<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إعدادات حسابي | Menu Smart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .admin-settings-page {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .settings-header {
            background: #111827;
            color: white;
            border-radius: 22px;
            padding: 25px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            box-shadow: 0 12px 30px rgba(17, 24, 39, .12);
        }

        .settings-heading {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .settings-heading-icon {
            width: 58px;
            height: 58px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, .14);
            color: #d4af37;
            font-size: 25px;
        }

        .settings-heading h1 {
            margin: 0;
            font-size: 25px;
        }

        .settings-heading p {
            margin: 7px 0 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.06);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .settings-card {
            background: white;
            border-radius: 22px;
            padding: 26px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 12px 30px rgba(17, 24, 39, .07);
        }

        .settings-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            margin-bottom: 22px;
            border-bottom: 1px solid #eef0f3;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #111827;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .settings-card h2 {
            margin: 0;
            font-size: 19px;
        }

        .settings-card-subtitle {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3e8;
            border-radius: 12px;
            background: #f9fafb;
            color: #111827;
            outline: none;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #d4af37;
            background: white;
        }

        .save-btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 13px;
            background: #111827;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #1f2937;
        }

        .danger-note {
            background: #fff8e7;
            border: 1px solid #f0dfaa;
            color: #7c5b00;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        @media (max-width: 800px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .settings-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<div class="admin-settings-page">

    <!-- HEADER -->

    <div class="settings-header">

        <div class="settings-heading">

            <div class="settings-heading-icon">
                ⚙
            </div>

            <div>
                <h1>إعدادات حسابي</h1>
                <p>إدارة بيانات حساب مدير النظام وكلمة المرور</p>
            </div>

        </div>

        <a
            href="{{ url_for('admin') }}"
            class="back-btn"
        >
            ← لوحة الإدارة
        </a>

    </div>


    <div class="settings-grid">

        <!-- ACCOUNT CARD -->

        <div class="settings-card">

            <div class="settings-card-header">

                <div class="card-icon">
                    👤
                </div>

                <div>
                    <h2>بيانات الحساب</h2>
                    <p class="settings-card-subtitle">
                        تعديل بيانات مدير النظام
                    </p>
                </div>

            </div>

            <form
                method="POST"
                action="{{ url_for('admin_settings') }}"
            >

                <input
                    type="hidden"
                    name="action"
                    value="profile"
                >

                <div class="field">

                    <label>
                        اسم الأدمن
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ user['name'] or '' }}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user['email'] or '' }}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        رقم الهاتف
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ user['phone'] or '' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    حفظ بيانات الحساب
                </button>

            </form>

        </div>


        <!-- PASSWORD CARD -->

        <div class="settings-card">

            <div class="settings-card-header">

                <div class="card-icon">
                    🔐
                </div>

                <div>
                    <h2>أمان الحساب</h2>
                    <p class="settings-card-subtitle">
                        تغيير كلمة مرور مدير النظام
                    </p>
                </div>

            </div>

            <div class="danger-note">
                لأمان حسابك، أدخل كلمة المرور الحالية قبل تعيين كلمة مرور جديدة.
            </div>

            <form
                method="POST"
                action="{{ url_for('admin_settings') }}"
            >

                <input
                    type="hidden"
                    name="action"
                    value="password"
                >

                <div class="field">

                    <label>
                        كلمة المرور الحالية
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        كلمة المرور الجديدة
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    تغيير كلمة المرور
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
