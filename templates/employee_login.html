<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دخول الموظف - MenuSmart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f5f2;
            color: #111;
        }

        .employee-login-card {
            width: 100%;
            max-width: 420px;

            background: #fff;

            padding: 32px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 900;
        }

        .logo p {
            margin: 0;

            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #ddd;

            border-radius: 12px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #111;
        }

        .login-btn {
            width: 100%;

            border: 0;

            padding: 14px;

            border-radius: 12px;

            background: #111;
            color: #fff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 13px;
        }

        .back-link:hover {
            color: #111;
        }

        .flash {
            margin-bottom: 18px;

            padding: 12px;

            border-radius: 10px;

            background: #f8eaea;
            color: #b42318;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>


<body>

    <div class="employee-login-card">

        <div class="logo">

            <h1>
                MenuSmart
            </h1>

            <p>
                دخول الموظفين
            </p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('employee_login') }}"
        >

            <div class="form-group">

                <label for="name">
                    اسم الموظف
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="أدخل اسم الموظف"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                تسجيل الدخول
            </button>

        </form>


        <a
            href="{{ url_for('login') }}"
            class="back-link"
        >
            العودة إلى تسجيل الدخول الرئيسي
        </a>

    </div>

</body>

</html>
