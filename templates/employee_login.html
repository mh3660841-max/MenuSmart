<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الموظفين | Menu Smart</title>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f4f6f9;
            font-family:Arial,sans-serif;
            padding:20px;
        }

        .login-card{
            width:100%;
            max-width:430px;
            background:#fff;
            padding:35px;
            border-radius:22px;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        .logo{
            text-align:center;
            font-size:28px;
            font-weight:800;
            margin-bottom:10px;
        }

        .logo span{
            color:#d4af37;
        }

        h1{
            text-align:center;
            margin:10px 0;
            color:#111827;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin:12px 0 7px;
            font-weight:700;
            color:#374151;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:12px;
            background:#fff;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#d4af37;
            box-shadow:0 0 0 3px rgba(212,175,55,.12);
        }

        button{
            width:100%;
            margin-top:22px;
            padding:14px;
            border:0;
            border-radius:12px;
            background:#111827;
            color:#fff;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#6b7280;
            text-decoration:none;
        }

        .flash{
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
            background:#fff7ed;
            color:#9a3412;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <span>M</span> Menu Smart
    </div>

    <h1>دخول الموظفين</h1>

    <div class="subtitle">
        سجّل الدخول باستخدام اسم الموظف وكلمة المرور
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>اسم الموظف</label>

        <input
            type="text"
            name="name"
            placeholder="أدخل اسم الموظف"
            required
        >

        <label>كلمة المرور</label>

        <input
            type="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <button type="submit">
            تسجيل الدخول
        </button>

    </form>

    <a href="{{ url_for('login') }}" class="back">
        ← العودة لتسجيل الدخول
    </a>

</div>

</body>
</html>
