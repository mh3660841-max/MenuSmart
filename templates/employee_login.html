<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الموظفين | Menu Smart</title>

    <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 16px;
    background:
        radial-gradient(ellipse at 85% 10%, rgba(139, 92, 246, .2), transparent 42%),
        radial-gradient(ellipse at 10% 90%, rgba(56, 189, 248, .13), transparent 40%),
        #080d1b;
    font-family: Arial, sans-serif;
    color: #edf1ff;
}

.login-card {
    width: 100%;
    max-width: 430px;
    padding: 36px;
    background: linear-gradient(150deg, #17223a, #111a2e);
    border: 1px solid rgba(148, 163, 184, .17);
    border-radius: 23px;
    box-shadow: 0 24px 65px rgba(0, 0, 0, .32);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .2px;
    margin-bottom: 18px;
    color: #edf1ff;
}

.logo span {
    color: #a78bfa;
}

h1 {
    text-align: center;
    margin: 10px 0;
    color: #fff;
    font-size: 24px;
}

.subtitle {
    text-align: center;
    color: #9aa8c0;
    margin-bottom: 27px;
    font-size: 14px;
    line-height: 1.8;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-size: 14px;
    font-weight: 700;
    color: #d7def0;
}

input {
    display: block;
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(148, 163, 184, .25);
    border-radius: 12px;
    background: #0d1628;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    transition: border-color .2s ease, box-shadow .2s ease;
}

input::placeholder {
    color: #718096;
}

input:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, .17);
}

button {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: 1px solid rgba(196, 181, 253, .25);
    border-radius: 12px;
    background: linear-gradient(110deg, #6d28d9, #8b5cf6);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: filter .2s ease, transform .2s ease;
}

button:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

button:focus-visible,
.back:focus-visible {
    outline: 2px solid #38bdf8;
    outline-offset: 3px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #9aa8c0;
    font-size: 14px;
    text-decoration: none;
    transition: color .2s ease;
}

.back:hover {
    color: #38bdf8;
}

.flash {
    padding: 13px 14px;
    border: 1px solid rgba(251, 146, 60, .25);
    border-radius: 11px;
    margin-bottom: 16px;
    background: rgba(154, 52, 18, .15);
    color: #fdba74;
    font-size: 14px;
    line-height: 1.7;
}

@media (max-width: 480px) {
    .login-card {
        padding: 28px 21px;
        border-radius: 19px;
    }

    .logo {
        font-size: 25px;
    }

    h1 {
        font-size: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    input,
    button,
    .back {
        transition: none;
    }
}

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <span>M</span> Menu Smart
    </div>

    <h1>دخول الموظفين</h1>

    <div class="subtitle">
        سجّل الدخول باستخدام اسم الموظف وكلمة المرور
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>اسم الموظف</label>

        <input
            type="text"
            name="name"
            placeholder="أدخل اسم الموظف"
            required
        >

        <label>كلمة المرور</label>

        <input
            type="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <button type="submit">
            تسجيل الدخول
        </button>

    </form>

    <a href="{{ url_for('login') }}" class="back">
        ← العودة لتسجيل الدخول
    </a>

</div>

</body>
</html>
